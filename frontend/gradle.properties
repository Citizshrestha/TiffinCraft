# Gradle JVM settings - increased memory for better performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration cache (Gradle 8.0+)
org.gradle.configuration-cache=true

# DO NOT hardcode org.gradle.java.home here
# Gradle will automatically use the system JAVA_HOME environment variable
# If you need to override, set JAVA_HOME before running gradle commands:
# Windows: $env:JAVA_HOME="C:\path\to\jdk" ; .\gradlew build
# Linux/Mac: JAVA_HOME=/path/to/jdk ./gradlew build

# AndroidX migration settings
android.useAndroidX=true

# Jetifier is deprecated and removed (no longer needed with AndroidX)
# All libraries now use AndroidX natively
# android.enableJetifier=true  # REMOVED - deprecated in AGP 10.0
