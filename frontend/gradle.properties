# Gradle JVM settings - increased memory for better performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dorg.gradle.java.home=D:\\DevTools\\Java\\jdk-21.0.5.11-hotspot

# Force Gradle to use system JDK instead of VS Code's embedded JRE
# This MUST point to a full JDK (not JRE) with jlink included
org.gradle.java.home=D:\\DevTools\\Java\\jdk-21.0.5.11-hotspot

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel builds
org.gradle.parallel=true

# Disable configuration cache to avoid jlink caching issues
org.gradle.configuration-cache=false

# Disable build cache to force fresh builds
org.gradle.caching=false

# AndroidX migration settings
android.useAndroidX=true

# Jetifier is deprecated and removed (no longer needed with AndroidX)
# android.enableJetifier=true  # REMOVED - deprecated in AGP 10.0
